{% extends "base.html" %}
{% block title %}Password updated - {{ site_name }}{% endblock %}
{% block content %}
<section class="auth-wrap">
    <div class="glass auth-card animate-up text-center">
        <span class="brand-logo large"><i class="fa-solid fa-circle-check"></i></span>
        <h2>Password updated</h2>
        <p class="text-muted-soft">Your password has been changed. You can now sign in.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-glow">Sign in</a>
    </div>
</section>
{% endblock %}
