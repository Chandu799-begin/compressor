{% extends "base.html" %}
{% block title %}Email sent - {{ site_name }}{% endblock %}
{% block content %}
<section class="auth-wrap">
    <div class="glass auth-card animate-up text-center">
        <span class="brand-logo large"><i class="fa-solid fa-paper-plane"></i></span>
        <h2>Check your inbox</h2>
        <p class="text-muted-soft">If an account exists for that email, a password reset link is on its way.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-glow">Back to sign in</a>
    </div>
</section>
{% endblock %}
